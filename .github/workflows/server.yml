name: Linux checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Server checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run check
      - run: bun run test
      - run: bun run generate:api --check

  desktop:
    name: Native Qt desktop
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install Linux desktop build dependencies
        run: pacman -Syu --noconfirm --needed git unzip cmake ninja qt6-base qt6-declarative qt6-multimedia libsamplerate dbus noto-fonts
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: cmake -S Linux -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/linux --parallel 4
      - run: ctest --test-dir build/linux --output-on-failure --no-tests=error

  coordinator:
    name: Compiled server (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd Server build --target=${{ matrix.target }}
      - name: Smoke compiled executable
        run: ./build/server/sotto-server --help
      - name: Test compiled HTTP server
        run: bun Server/scripts/smoke.ts --executable ./build/server/sotto-server
      - name: Verify native directory lock and compiled FFI
        run: bun test Server/tests/data-lock.test.ts
      - name: Verify embedded correction worker
        run: bun test Server/tests/correction-worker-standalone.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sotto-server-coordinator-${{ matrix.target }}
          path: build/server/sotto-server
          if-no-files-found: error

  native:
    name: Native CPU helpers (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config libcurl4-openssl-dev
      - name: Build portable CPU package
        env:
          SOTTO_NATIVE: "OFF"
          SOTTO_CUDA: "OFF"
          SOTTO_BUILD_JOBS: "4"
        run: ./scripts/build-server.sh
      - run: ./build/server/sotto-server --help
      - name: Test packaged HTTP server
        run: bun Server/scripts/smoke.ts --executable ./build/server/sotto-server
      - name: Archive complete platform package
        run: tar -czf build/sotto-server-${{ matrix.platform }}-cpu.tar.gz -C build server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sotto-server-${{ matrix.platform }}-cpu
          path: build/sotto-server-${{ matrix.platform }}-cpu.tar.gz
          if-no-files-found: error
