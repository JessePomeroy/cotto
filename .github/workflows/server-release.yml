name: Server release packages

on:
  workflow_dispatch:
  push:
    tags: [server-v*]

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64-cpu
          - runner: ubuntu-24.04-arm
            platform: linux-arm64-cpu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config libcurl4-openssl-dev
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Verify embedded correction worker
        run: bun test Server/tests/correction-worker-standalone.test.ts
      - name: Build complete platform package
        env:
          SOTTO_NATIVE: "OFF"
          SOTTO_CUDA: "OFF"
          SOTTO_BUILD_JOBS: "4"
        run: ./scripts/build-server.sh
      - run: ./build/server/sotto-server --help
      - name: Test packaged HTTP server
        run: bun Server/scripts/smoke.ts --executable ./build/server/sotto-server
      - name: Package and checksum
        run: |
          cd build
          tar -czf sotto-server-${{ matrix.platform }}.tar.gz server
          sha256sum sotto-server-${{ matrix.platform }}.tar.gz > sotto-server-${{ matrix.platform }}.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sotto-server-${{ matrix.platform }}
          path: |
            build/sotto-server-${{ matrix.platform }}.tar.gz
            build/sotto-server-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
