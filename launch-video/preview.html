<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101c26" />
    <title>Sotto — Launch film</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101c26;
        --ink: #edf5fa;
        --blue: #a7d6f5;
        --muted: #9bafbc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: min(
          1120px,
          calc(100% - 48px),
          max(640px, calc((100svh - 245px) * 16 / 9))
        );
        margin: 0 auto;
        padding: 36px 0 25px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 27px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: inherit;
        font:
          36px/1 Georgia,
          "Times New Roman",
          serif;
        letter-spacing: -1.8px;
      }
      .brand img {
        width: 35px;
        height: 35px;
      }
      .download {
        display: inline-flex;
        gap: 9px;
        align-items: center;
        text-decoration: none;
        color: var(--blue);
        font-size: 13px;
        padding: 9px 0;
      }
      a:hover {
        color: #fff;
      }
      a:focus-visible,
      button:focus-visible,
      video:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 5px;
      }
      .film {
        position: relative;
        aspect-ratio: 16/9;
        background: #0a1219;
        overflow: hidden;
        border: 1px solid #263641;
        border-radius: 12px;
        box-shadow: 0 24px 80px #0003;
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .start {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 76px;
        height: 76px;
        border: 1px solid #ffffff55;
        border-radius: 50%;
        background: #101c26cc;
        color: var(--ink);
        cursor: pointer;
        backdrop-filter: blur(14px);
        transition:
          background 0.2s,
          scale 0.2s;
      }
      .start:hover {
        background: #324b60dd;
        scale: 1.04;
      }
      .start[hidden] {
        display: none;
      }
      .start svg {
        width: 25px;
        margin-left: 4px;
      }
      .details {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 20px;
        margin: 22px 0 16px;
      }
      h1 {
        font-size: 20px;
        font-weight: 500;
        letter-spacing: -0.4px;
        margin: 0;
      }
      .specs {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      .chapters {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        padding: 0 0 24px;
        border-bottom: 1px solid #ffffff13;
      }
      .chapters button {
        border: 1px solid #ffffff18;
        border-radius: 100px;
        background: transparent;
        padding: 7px 12px;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        transition:
          color 0.15s,
          background 0.15s,
          border-color 0.15s;
      }
      .chapters button:hover {
        color: var(--ink);
        background: #ffffff07;
      }
      .chapters button[aria-current="true"] {
        color: var(--blue);
        border-color: #a7d6f54a;
        background: #a7d6f510;
      }
      footer {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 24px;
        padding-top: 18px;
        font-size: 11px;
        color: var(--muted);
      }
      footer p {
        margin: 0;
      }
      footer a {
        color: inherit;
        text-decoration-color: #9bafbc55;
        text-underline-offset: 3px;
      }
      @media (max-width: 600px) {
        main {
          width: calc(100% - 28px);
          padding-top: 24px;
        }
        header {
          margin-bottom: 22px;
        }
        .brand {
          font-size: 31px;
        }
        .brand img {
          width: 30px;
          height: 30px;
        }
        .film {
          border-radius: 8px;
        }
        .start {
          width: 58px;
          height: 58px;
        }
        .details {
          margin-top: 18px;
        }
        h1 {
          font-size: 18px;
        }
        .specs {
          font-size: 11px;
        }
        .chapters {
          gap: 6px;
        }
        .chapters button {
          padding: 6px 10px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="preview.html" aria-label="Sotto preview"
          ><img src="assets/icon.svg" alt="" />Sotto</a
        >
        <a
          class="download"
          href="renders/sotto-launch.mp4"
          download="sotto-launch.mp4"
          >Download MP4 <span aria-hidden="true">↓</span></a
        >
      </header>
      <div class="film">
        <video
          id="film"
          controls
          playsinline
          preload="metadata"
          poster="assets/poster.jpg"
          aria-label="Sotto launch film"
        >
          <source src="renders/sotto-launch.mp4" type="video/mp4" />
          Your browser does not support this video.
          <a href="renders/sotto-launch.mp4">Download the film.</a>
        </video>
        <button
          class="start"
          id="start"
          type="button"
          aria-label="Play Sotto launch film"
        >
          <svg viewBox="0 0 24 28" fill="currentColor" aria-hidden="true">
            <path
              d="M2 1.5a1 1 0 0 1 1.5-.87l20 12.5a1 1 0 0 1 0 1.74l-20 12.5A1 1 0 0 1 2 26.5z"
            />
          </svg>
        </button>
      </div>
      <div class="details">
        <h1>Launch film · Work in progress</h1>
        <span class="specs">51 seconds · 1080p</span>
      </div>
      <nav class="chapters" aria-label="Film chapters">
        <button type="button" data-time="0" aria-current="true">
          Dictation
        </button>
        <button type="button" data-time="9">Privacy</button>
        <button type="button" data-time="16">Lists</button>
        <button type="button" data-time="24">Dictionary</button>
        <button type="button" data-time="31">Microphones</button>
        <button type="button" data-time="38">History</button>
        <button type="button" data-time="45">Sotto</button>
      </nav>
      <footer>
        <p>Illustrative demos with sample text.</p>
        <p>
          Composed with
          <a
            href="https://hyperframes.heygen.com/"
            target="_blank"
            rel="noreferrer"
            >Hyperframes</a
          >
        </p>
      </footer>
    </main>
    <script>
      const video = document.getElementById("film");
      const start = document.getElementById("start");
      const chapters = [...document.querySelectorAll("[data-time]")];
      const play = () =>
        video.play().catch(() => {
          start.hidden = false;
        });
      start.addEventListener("click", play);
      video.addEventListener("play", () => {
        start.hidden = true;
      });
      video.addEventListener("ended", () => {
        start.hidden = false;
      });
      chapters.forEach((button) =>
        button.addEventListener("click", () => {
          video.currentTime = Number(button.dataset.time);
          play();
        }),
      );
      video.addEventListener("timeupdate", () => {
        const current = chapters
          .filter((button) => Number(button.dataset.time) <= video.currentTime)
          .at(-1);
        chapters.forEach((button) => {
          if (button === current) button.setAttribute("aria-current", "true");
          else button.removeAttribute("aria-current");
        });
      });
    </script>
  </body>
</html>
